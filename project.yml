name: AgenteRilievi
options:
  bundleIdPrefix: com.agenterilievi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AgenteRilievi:
    type: application
    platform: iOS
    sources:
      - AgenteY
    info:
      path: AgenteY/Info.plist
      properties:
        CFBundleDisplayName: MARK Rilievi
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        CFBundleDevelopmentRegion: it
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "Serve la fotocamera e il laser per fare il rilievo della stanza."
        NSLocalNetworkUsageDescription: "Serve per trovare MARK sulla Wi-Fi dell'ufficio e mandargli i rilievi."
        NSBonjourServices: [_mark-rilievi._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenterilievi.y
        PRODUCT_NAME: AgenteRilievi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    scheme: {}
